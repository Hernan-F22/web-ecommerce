    <!-- Letter C -->
    <path d="M 48.5 26 L 43.5 28 C 42.5 25.5 39.5 24 37 25 C 33.5 26.5 32 31 32 32 C 32 35.5 34 39 37.5 39 C 40 39 42.5 38 43.8 35.5 L 48.8 37.5 C 46.2 42.5 42 44.5 37.5 44.5 C 30 44.5 26.5 38 26.5 32 C 26.5 25.5 31 19.5 37.5 19.5 C 42 19.5 46.5 21.8 48.5 26 Z"/>
  </g>

  <!-- Accent Tech Dot (Top Right) -->
  <circle cx="50" cy="14" r="4.5" fill="#090d16"/>
  <circle cx="50" cy="14" r="2.6" fill="#38bdf8"/>
</svg>
